audio.addEventListener('pause',()=>{if(ms)ms.playbackState='paused';updatePosition();updateAOD()});
audio.addEventListener('loadedmetadata',()=>{updateMediaSession();updatePosition()});
audio.addEventListener('ratechange',updatePosition);
// When returning to the page, refresh the screen so the UI matches what played in the background.
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(view==='now')render();updateMediaSession();updatePosition()}});

// ---- AOD: keep the screen awake and dim to an always-on display after a short idle ----
let wakeLock=null,aodTimer=0,aodClock=0;const AOD_IDLE=15000;
async function acquireWakeLock(){if(!aodEnabled||document.hidden||wakeLock||!('wakeLock' in navigator))return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}catch(e){wakeLock=null}}
function releaseWakeLock(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}}
function aodShown(){return $('aod').classList.contains('on')}
function updateAOD(){if(!aodShown())return;const now=new Date(),lang=uiLanguage;$('aodTime').textContent=now.toLocaleTimeString(lang,{hour:'numeric',minute:'2-digit'}).replace(/\s?(AM|PM|오전|오후|午前|午後|上午|下午)\s?/,'');$('aodDate').textContent=now.toLocaleDateString(lang,{weekday:'long',month:'long',day:'numeric'});
const t=tracks[current],np=$('aodNp');np.style.display=t?'flex':'none';if(t){$('aodTitle').textContent=(audio.paused?'Ⅱ  ':'▶  ')+t.name;$('aodArtist').textContent=t.artist||translateUI('알 수 없는 아티스트');const a=$('aodArt');if(t.artwork){a.src=t.artwork;a.style.display=''}else{a.removeAttribute('src');a.style.display='none'}$('aodBar').style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%'}$('aodHint').textContent=translateUI('탭하여 깨우기')}
function shiftAOD(){const r=()=>Math.round((Math.random()-.5)*24)+'px';const i=document.querySelector('.aod-inner');i.style.setProperty('--dx',r());i.style.setProperty('--dy',r())}
function showAOD(){if(!aodEnabled||document.hidden||aodShown())return;$('aod').classList.add('on');updateAOD();clearInterval(aodClock);aodClock=setInterval(()=>{updateAOD();shiftAOD()},20000)}
function hideAOD(){clearInterval(aodClock);$('aod').classList.remove('on')}
function armAOD(){clearTimeout(aodTimer);if(aodEnabled)aodTimer=setTimeout(showAOD,AOD_IDLE)}
function wakeFromAOD(e){if(aodShown()){hideAOD();e?.preventDefault?.();e?.stopPropagation?.()}armAOD()}
$('aod').addEventListener('pointerdown',wakeFromAOD);
['pointerdown','keydown','wheel'].forEach(ev=>document.addEventListener(ev,e=>{if(aodShown()){wakeFromAOD(e);return}armAOD()},{capture:true,passive:false}));
audio.addEventListener('timeupdate',()=>{if(aodShown())$('aodBar').style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%'});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hideAOD();clearTimeout(aodTimer)}else{acquireWakeLock();armAOD()}});
function setAOD(on){aodEnabled=on;try{localStorage.setItem('classic-aod',on?'1':'0')}catch(e){}if(on){acquireWakeLock();armAOD();if(!('wakeLock' in navigator))error=translateUI('이 브라우저는 화면 켜짐 유지를 지원하지 않아요.')}else{releaseWakeLock();clearTimeout(aodTimer);hideAOD()}}
setAOD(aodEnabled);
</script></body></html>
